<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#159a50"><title>Login — EcoGreen Community</title><link rel="stylesheet" href="styles.css"><script src="auth.js" defer></script></head>
<body class="auth-page">
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">♧</span><span>EcoGreen</span></a><a class="button button-small" href="signup.html">Create account</a></header>
  <main class="auth-wrap"><section class="auth-card"><div class="auth-mark">♧</div><p class="eyebrow">WELCOME BACK</p><h1>Welcome back</h1><p class="auth-subtitle">Sign in to continue your green journey.</p>
<form id="login-form">
      <label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
      <label for="login-password">Password</label><div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="password-toggle" type="button" data-toggle="login-password" aria-label="Show password">Show</button></div>
      <p class="form-message" id="login-message" role="status" aria-live="polite"></p><button class="button auth-submit" type="submit">Sign In</button>
    </form>
    <p class="auth-switch">Don’t have an account? <a href="signup.html">Sign up</a></p>
    <p class="demo-note">Local demo only: account data stays in this browser. Do not use a password you use elsewhere.</p>
  </section><a class="back-home" href="index.html">← Back to EcoGreen</a></main>
</body></html>
